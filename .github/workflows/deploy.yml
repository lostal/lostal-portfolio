# Deploy a Cloudflare Pages con generación de CV
# Este workflow genera los PDFs del CV con Puppeteer y despliega a Cloudflare

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [v1]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lostal.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install Puppeteer dependencies
        run: npx puppeteer browsers install chrome

      - name: Build (includes CV generation)
        run: pnpm build

      - name: Verify PDFs were generated
        run: |
          if [ ! -f dist/AlvaroLostal_CV.pdf ]; then
            echo "❌ Error: dist/AlvaroLostal_CV.pdf no encontrado"
            exit 1
          fi
          if [ ! -f dist/AlvaroLostal_Resume.pdf ]; then
            echo "❌ Error: dist/AlvaroLostal_Resume.pdf no encontrado"
            exit 1
          fi
          echo "✅ PDFs verificados correctamente"
          ls -lh dist/*.pdf

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lostal-portfolio --commit-dirty=true
