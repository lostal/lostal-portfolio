# Deploy a Cloudflare Pages con generación de CV
# Este workflow genera los PDFs del CV con Puppeteer y despliega a Cloudflare

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [v1]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://lostal.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Puppeteer dependencies
        run: npx puppeteer browsers install chrome

      - name: Build (includes CV generation)
        run: pnpm build

      - name: Verify PDFs were generated
        run: |
          for pdf in dist/AlvaroLostal_CV.pdf dist/AlvaroLostal_Resume.pdf; do
            if [ ! -f "$pdf" ]; then
              echo "❌ Error: $pdf no encontrado"
              exit 1
            fi
            header=$(head -c 4 "$pdf")
            if [ "$header" != "%PDF" ]; then
              echo "❌ Error: $pdf no es un PDF válido (header: $header)"
              exit 1
            fi
            echo "✅ $pdf - $(du -h $pdf | cut -f1)"
          done

      - name: Commit generated PDFs to public/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/AlvaroLostal_CV.pdf public/AlvaroLostal_Resume.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore: update CV PDFs [skip ci]"
            git push
            echo "✅ PDFs actualizados en public/"
          else
            echo "ℹ️ PDFs sin cambios, no se requiere commit"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lostal-portfolio --commit-dirty=true
